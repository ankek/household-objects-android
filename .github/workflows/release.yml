name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches app version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app_version=$(sed -n 's/.*ClientVersion\.validate("\([^"]*\)").*/\1/p' app/build.gradle.kts)
          if [ "$tag" != "$app_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $app_version in app/build.gradle.kts"
            exit 1
          fi
          echo "name=$app_version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "HHO_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testFossDebugUnitTest testGmsDebugUnitTest

      - name: Assemble release APKs
        env:
          HHO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HHO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HHO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleFossRelease assembleGmsRelease

      - name: Collect artifacts
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p dist
          for flavor in foss gms; do
            cp "app/build/outputs/apk/$flavor/release/app-$flavor-release.apk" "dist/hho-$VERSION-$flavor.apk"
          done
          cd dist
          sha256sum *.apk > SHA256SUMS

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$VERSION" \
            --generate-notes \
            --verify-tag \
            dist/*.apk dist/SHA256SUMS
