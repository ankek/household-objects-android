name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}

    steps:
      - uses: actions/checkout@v5

      - name: Read app version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::VERSION must contain MAJOR.MINOR.PATCH (e.g. 1.4.2), got '$version'"
            exit 1
          fi
          tag="v$version"

          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $version"
            exit 1
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to publish. Bump the version to make a new release."
            publish=false
          else
            echo "Release $tag will be published."
            publish=true
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish release
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Restore and verify signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (Settings > Secrets and variables > Actions)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          keystore="$RUNNER_TEMP/release.jks"
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore"; then
            echo "::error::KEYSTORE_BASE64 is not valid base64. Create it with: base64 -w0 release.jks"
            exit 1
          fi

          if ! keytool -list -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Cannot open the keystore with KEYSTORE_PASSWORD. Either the password is wrong or KEYSTORE_BASE64 does not contain the right keystore."
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Alias from KEY_ALIAS not found in the keystore. Available aliases:"
            keytool -list -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" | grep -i 'entry' || true
            exit 1
          fi

          echo "HHO_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testFossDebugUnitTest testGmsDebugUnitTest

      - name: Assemble release APKs
        env:
          HHO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HHO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HHO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleFossRelease assembleGmsRelease

      - name: Collect artifacts
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p dist
          for flavor in foss gms; do
            cp "app/build/outputs/apk/$flavor/release/app-$flavor-release.apk" "dist/hho-$VERSION-$flavor.apk"
          done
          cd dist
          sha256sum -- *.apk > SHA256SUMS

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            dist/*.apk dist/SHA256SUMS
